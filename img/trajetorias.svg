="3" marker-end="url(#ar)"/><text x="238.0" y="170.0" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">2</text><path d="M135,245 Q85,90 175,72" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/><text x="88.0" y="150.0" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">3</text><path d="M268,248 Q320,90 225,72" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#ao)"/><text x="318.0" y="150.0" font-size="16" fill="#ea580c" text-anchor="middle" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">4</text><text x="550.0" y="22.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" style="font-family:Helvetica,Arial,sans-serif">UPPERCUT 5/6 (vista lateral)</text><circle cx="600" cy="80" r="24" fill="#fde68a" stroke="#111827"/><text x="600.0" y="84.0" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">queixo</text><path d="M510,250 Q550,235 570,200 Q590,150 590,110" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/><text x="495.0" y="175.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">joelho flexiona</text><text x="495.0" y="190.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">→ perna e quadril sobem</text><text x="550.0" y="270.0" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" style="font-family:Helvetica,Arial,sans-serif">curto · cotovelo ~90° · não "pescar" lá de baixo</text></svg>